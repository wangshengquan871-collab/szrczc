<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="欢迎登录苏州人才政策综合展示平台，查阅科技创新创业领军人才政策。">
  <title>账户状态 · 苏州人才政策</title>
  <link rel="icon" href="assets/images/portal-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/auth.css">
  <script defer src="js/account.js"></script>
</head>
<body class="sz-auth-page" data-auth-mode="account">
  <a class="auth-skip" href="#auth-form-title">跳转到账户信息</a>
  <main class="auth-layout">
    <section class="auth-visual" aria-labelledby="auth-platform-title">
      <div class="auth-brand"><img src="assets/images/portal-mark.svg" width="42" height="42" alt=""><span>江南 · 苏州<small>SUZHOU TALENT POLICY</small></span></div>
      <div class="auth-intro">
        <p class="auth-eyebrow">POLICY / PEOPLE / POSSIBILITIES</p>
        <h1 id="auth-platform-title">苏州人才政策</h1>
        <p class="auth-platform-name">科技创新创业领军人才政策<br>综合展示平台</p>
        <div class="auth-gold-line" aria-hidden="true"></div>
        <p class="auth-intro-note">与苏州创新同行<br>让每一份潜力，找到生长的方向</p>
      </div>
      <img class="auth-architecture" src="assets/images/jiangnan-architecture.svg" width="1800" height="1000" fetchpriority="high" alt="白墙、黛瓦与水院组成的江南建筑插画">
      <p class="auth-scene-caption"><span>白墙 · 黛瓦 · 水院</span><span>INNOVATION IN SUZHOU</span></p>
    </section>
    <section class="auth-panel" aria-labelledby="auth-form-title">
      <p class="auth-panel-label" aria-hidden="true">SUZHOU / ACCOUNT</p>
      <div class="auth-form-wrap">
        <header class="auth-form-header">
          <p class="auth-kicker">YOUR ACCOUNT</p>
          <h2 id="auth-form-title" tabindex="-1">账户状态</h2>
          <p class="auth-form-description">查看您的登录信息，安全管理当前会话。</p>
        </header>
        <p class="auth-account-status" id="account-status" role="status" aria-live="polite" tabindex="-1">正在验证登录状态…</p>
        <div id="account-details" hidden><dl class="auth-account-details"><div><dt>用户名</dt><dd id="account-username"></dd></div><div><dt>电子邮箱</dt><dd id="account-email"></dd></div><div><dt>最近登录（北京时间）</dt><dd id="account-last-login"></dd></div></dl><button class="auth-submit" id="account-logout" type="button" disabled>退出登录</button></div>
        <button class="auth-submit" id="account-retry" type="button" hidden>重新验证</button>
        <p class="auth-switch"><a href="index.html" id="account-home">返回政策首页</a></p>
        <noscript><p class="auth-noscript">请启用JavaScript以查看账户和退出登录。</p></noscript>
        <p class="auth-form-footer"><svg viewBox="0 0 16 18" fill="none" aria-hidden="true"><path d="M3 8V5a5 5 0 0 1 10 0v3M2 8h12v8H2zM8 11v3" stroke="currentColor" stroke-width="1.2"/></svg><span>苏州人才政策 · 账户服务</span></p>
      </div>
    </section>
  </main>
</body>
</html>
