<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" fill="none">
  <title>白墙水院 · 原创江南建筑意象</title>
  <desc>以白墙、灰色几何屋面、采光窗、片石和水院绘制的原创建筑插画，非实景照片。</desc>
  <defs>
    <linearGradient id="sky" x1="900" y1="0" x2="900" y2="1000" gradientUnits="userSpaceOnUse"><stop stop-color="#F1F0E9"/><stop offset=".58" stop-color="#F8F8F1"/><stop offset="1" stop-color="#D9DFD5"/></linearGradient>
    <linearGradient id="water" x1="1200" y1="650" x2="1200" y2="1000" gradientUnits="userSpaceOnUse"><stop stop-color="#B4C0B1"/><stop offset=".45" stop-color="#CBD3C5"/><stop offset="1" stop-color="#DFE3D7"/></linearGradient>
    <linearGradient id="wall" x1="900" y1="410" x2="1600" y2="680" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFB"/><stop offset="1" stop-color="#E5E6DC"/></linearGradient>
    <linearGradient id="roof" x1="1200" y1="300" x2="1250" y2="550" gradientUnits="userSpaceOnUse"><stop stop-color="#58615B"/><stop offset="1" stop-color="#343E37"/></linearGradient>
    <linearGradient id="glass" x1="1220" y1="395" x2="1435" y2="645" gradientUnits="userSpaceOnUse"><stop stop-color="#72877B"/><stop offset="1" stop-color="#ADBBA9"/></linearGradient>
    <linearGradient id="fade"><stop stop-color="white" stop-opacity=".55"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
    <pattern id="ripples" width="220" height="29" patternUnits="userSpaceOnUse"><path d="M0 4h72m45 0h58M30 21h110m24 0h39" stroke="#F6F7ED" stroke-opacity=".32" stroke-width="1"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
